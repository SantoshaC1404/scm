server:
  port: ${SERVER_PORT}
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
      dialect: org.hibernate.dialect.MySQLDialect

# JWT SECURITY KEY & EXPIRE TIME
jwt:
  secret: ${JWT_SECURITY_KEY}
  expiration: 3600000
